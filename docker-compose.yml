version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: educontest_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      # SSL sertifikatlari uchun (agar ishlatilsa)
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - main_app
      - sat_app
    networks:
      - educontest_network
    restart: unless-stopped

  # Asosiy platforma (Main Platform) - port 8080
  main_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educontest_main
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    volumes:
      - ./public:/app/public:ro
    networks:
      - educontest_network
    restart: unless-stopped

  # O'quvchi SAT bo'limi (Student SAT Section) - port 8081
  sat_app:
    build:
      context: ./o'quvchi_SAT
      dockerfile: Dockerfile
    container_name: educontest_sat
    expose:
      - "8081"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    volumes:
      - ./o'quvchi_SAT/public:/app/public:ro
    networks:
      - educontest_network
    restart: unless-stopped

networks:
  educontest_network:
    driver: bridge